name: Docker Sync (skopeo)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"
  IMAGES_FILE: "images.txt"
  MODE: "pull"                # pull（快，需磁盘）| skopeo（零磁盘）
  PLATFORM: "linux/amd64"
  PULL_CONCURRENCY: "6"
  PUSH_CONCURRENCY: "3"
  BATCH_SIZE: "2"             # 大镜像多时调成 1
  RETRIES: "3"
  SKIP_EXISTING: "digest"
  SHARD_TOTAL: "4"

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet \
                     /usr/local/lib/android \
                     /opt/ghc \
                     /usr/local/share/boost \
                     /usr/share/swift \
                     "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af --volumes || true
          sudo rm -rf /var/lib/containerd/io.containerd.content.v1.content/blobs/sha256/* || true
          df -h /

      - name: Move containerd data to /mnt
        run: |
          set -e
          sudo systemctl stop docker docker.socket containerd || true
          sudo mkdir -p /mnt/docker /mnt/containerd
          sudo rsync -a /var/lib/docker/     /mnt/docker/ || true
          sudo rsync -a /var/lib/containerd/ /mnt/containerd/ || true
          sudo mount --bind /mnt/docker     /var/lib/docker
          sudo mount --bind /mnt/containerd /var/lib/containerd
          sudo systemctl start containerd
          sudo systemctl start docker
          sleep 3
          df -h /var/lib/containerd

      - name: Configure Docker
        run: |
          sudo mkdir -p /etc/docker
          sudo tee /etc/docker/daemon.json > /dev/null <<'JSONC'
          {
            "max-concurrent-downloads": 6,
            "max-concurrent-uploads": 6,
            "registry-mirrors": ["https://docker.m.daocloud.io"]
          }
          JSONC
          sudo systemctl restart docker
          docker info | grep -iE "registry mirrors|max concurrent"

      - name: Install tools
        run: |
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
          command -v zstd     >/dev/null || { sudo apt-get install -y -qq zstd; }
          command -v jq       >/dev/null || { sudo apt-get install -y -qq jq; }
          skopeo --version

      - name: Login to Aliyun
        if: env.ALIYUN_REGISTRY != '' && env.ALIYUN_REGISTRY_USER != ''
        run: |
          echo "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}" \
            | docker login "$ALIYUN_REGISTRY" \
              --username "$ALIYUN_REGISTRY_USER" --password-stdin

      - name: Pull and Push
        env:
          SHARD: "${{ matrix.shard }}"
        run: |
          cat > /tmp/sync.sh <<'EOSCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          MODE="${MODE:-pull}"
          PLATFORM="${PLATFORM:-linux/amd64}"
          PULL_CONCURRENCY="${PULL_CONCURRENCY:-6}"
          PUSH_CONCURRENCY="${PUSH_CONCURRENCY:-3}"
          BATCH_SIZE="${BATCH_SIZE:-2}"
          RETRIES="${RETRIES:-3}"
          SKIP_EXISTING="${SKIP_EXISTING:-digest}"
          IMAGES_FILE="${IMAGES_FILE:-images.txt}"
          SHARD="${SHARD:-0}"
          SHARD_TOTAL="${SHARD_TOTAL:-1}"
          DEST_BASE="${ALIYUN_REGISTRY}/${ALIYUN_NAME_SPACE}"

          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          mkdir -p "$WORK/list" "$WORK/pulled" "$WORK/fail"

          log() { printf '\033[36m[%(%H:%M:%S)T]\033[0m %s\n' -1 "$*" >&2; }

          # ── 清理磁盘 ────────────────────────────────────────
          reclaim() {
            docker image prune -af >/dev/null 2>&1 || true
            sudo rm -rf /var/lib/containerd/io.containerd.content.v1.content/blobs/sha256/* 2>/dev/null || true
            df -h / | tail -1 | awk '{print "  磁盘剩余: "$4" ("$5" 已用)"}'
          }

          # ── 解析行 ──────────────────────────────────────────
          parse_line() {
            local raw="${1%%#*}"
            local -a toks=()
            # shellcheck disable=SC2206
            toks=($raw)
            local plat="" img="" i
            for (( i=0; i<${#toks[@]}; i++ )); do
              case "${toks[$i]}" in
                --platform)     (( i++ )); plat="${toks[$i]:-}" ;;
                --platform=*)   plat="${toks[$i]#--platform=}" ;;
                --*)            ;;
                *)              img="${toks[$i]}" ;;
              esac
            done
            [ -n "$img" ] || return 1
            [ -n "$plat" ] || plat="$PLATFORM"
            printf '%s\t%s' "$plat" "$img"
          }

          # ── 候选源（国内代理优先）────────────────────────────
          candidates() {
            local img="$1" first path
            if [[ "$img" == */* ]]; then
              first="${img%%/*}"; path="${img#*/}"
              if [[ "$first" != *.* && "$first" != *:* ]]; then
                first="docker.io"; path="$img"
              fi
            else
              first="docker.io"; path="library/$img"
            fi
            case "$first" in
              docker.io|index.docker.io|registry-1.docker.io)
                printf '%s\n' "docker.m.daocloud.io/$path" \
                              "docker.1panel.live/$path" \
                              "hub.rat.dev/$path" ;;
              k8s.gcr.io|registry.k8s.io)
                printf '%s\n' "k8s-gcr.m.daocloud.io/$path" \
                              "registry.k8s.io/$path" ;;
              gcr.io)    printf '%s\n' "gcr.m.daocloud.io/$path" "gcr.io/$path" ;;
              quay.io)   printf '%s\n' "quay.m.daocloud.io/$path" "quay.io/$path" ;;
              ghcr.io)   printf '%s\n' "ghcr.m.daocloud.io/$path" "ghcr.io/$path" ;;
              *)         printf '%s\n' "$img" ;;
            esac
          }

          # ── 目标镜像名（registry 段降为子路径）────────────────
          dest_for() {
            local img="$1" first rest
            if [[ "$img" == */* ]]; then
              first="${img%%/*}"
              if [[ "$first" == *.* || "$first" == *:* ]]; then
                rest="${img#*/}"
                first="${first,,}"; first="${first//:/_}"
                printf '%s/%s' "$first" "$rest"
                return
              fi
            fi
            printf '%s' "$img"
          }

          platform_digest() {
            local ref="$1" plat="$2" os arch
            os="${plat%%/*}"; arch="${plat#*/}"
            docker manifest inspect --verbose "$ref" 2>/dev/null | jq -r --arg o "$os" --arg a "$arch" '
              (if type=="array" then . else [.] end)
              | map(select(.Descriptor.os==$o and .Descriptor.architecture==$a))
              | .[0].Descriptor.digest // empty' 2>/dev/null || true
          }

          already_synced() {
            [ "$SKIP_EXISTING" != "0" ] || return 1
            local plat="$1" img="$2" dest="$DEST_BASE/$(dest_for "$img")" cand d1 d2
            if [ "$SKIP_EXISTING" = "tag" ]; then
              docker manifest inspect "$dest" >/dev/null 2>&1 && return 0 || return 1
            fi
            while IFS= read -r cand; do
              [ -n "$cand" ] || continue
              d1="$(platform_digest "$cand" "$plat")"; [ -n "$d1" ] || continue
              d2="$(platform_digest "$dest"  "$plat")"; [ -n "$d2" ] || continue
              [ "$d1" = "$d2" ] && return 0
            done < <(candidates "$img")
            return 1
          }

          # ── 模式 A：skopeo 直传（零磁盘占用）──────────────────
          skopeo_one() {
            local plat="$1" img="$2"
            local dest="$DEST_BASE/$(dest_for "$img")"
            local os="${plat%%/*}" arch="${plat#*/}"
            local cand attempt
            if already_synced "$plat" "$img"; then
              log "SKIP  $img（目标已是同一 digest）"; return 0
            fi
            while IFS= read -r cand; do
              [ -n "$cand" ] || continue
              attempt=1
              while (( attempt <= RETRIES )); do
                if skopeo copy \
 --dest-creds "$ALIYUN_REGISTRY_USER:$ALIYUN_REGISTRY_PASSWORD" \
                      --override-os "$os" --override-arch "$arch" \
                      --retry-times 3 \
                      "docker://$cand" "docker://$dest" >/dev/null 2>&1; then
                  log "COPY  $img  =>  $dest"
                  return 0
                fi
                attempt=$(( attempt + 1 )); sleep $(( attempt * 2 ))
              done
              log "RETRY $img 源 $cand 失败，换下一个"
            done < <(candidates "$img")
            log "FAIL  $img"; printf '%s\n' "$img" >> "$WORK/fail"; return 1
          }

          # ── 模式 B：pull + push（快，需磁盘）──────────────────          pull_one() {
            local plat="$1" img="$2"
            local key cand attempt
            key="$(printf '%s' "$img" | tr '/:@' '___')"
            if already_synced "$plat" "$img"; then
              log "SKIP  $img（目标已是同一 digest）"
              printf '%s\n' "$img" > "$WORK/pulled/$key"; return 0
            fi
            while IFS= read -r cand; do
              [ -n "$cand" ] || continue
              attempt=1
              while (( attempt <= RETRIES )); do
                if docker pull --platform "$plat" "$cand" >/dev/null 2>&1; then
                  log "PULL  $img  <=  $cand"
                  printf '%s\n' "$cand" > "$WORK/pulled/$key"; return 0
                fi
                attempt=$(( attempt + 1 )); sleep $(( attempt * 2 ))
              done
              log "RETRY $img 源 $cand 失败，换下一个"
            done < <(candidates "$img")
            log "FAIL  $img（拉取失败）"; printf '%s\n' "$img" >> "$WORK/fail"; return 1
          }

          push_one() {
            local plat="$1" img="$2"
            local key src dest
            key="$(printf '%s' "$img" | tr '/:@' '___')"
            src="$WORK/pulled/$key"; [ -f "$src" ] || return 0
            src="$(cat "$src")"
            dest="$DEST_BASE/$(dest_for "$img")"
            docker tag "$src" "$dest" 2>/dev/null || true
            if docker push "$dest" >/dev/null 2>&1; then
              log "PUSH  $dest"
            else
              log "FAIL  $dest（推送失败）"; printf '%s\n' "$img" >> "$WORK/fail"
            fi
            docker rmi -f "$src" "$dest" >/dev/null 2>&1 || true
          }

          export -f skopeo_one pull_one push_one candidates dest_for already_synced platform_digest log reclaim
          export WORK MODE PLATFORM RETRIES SKIP_EXISTING DEST_BASE ALIYUN_REGISTRY_USER ALIYUN_REGISTRY_PASSWORD

          # ── 主流程 ───────────────────────────────────────────
          [ -f "$IMAGES_FILE" ] || { echo "找不到 $IMAGES_FILE" >&2; exit 1; }

          ALL="$WORK/all.txt"; : > "$ALL"
          while IFS= read -r raw || [ -n "$raw" ]; do
            parsed="$(parse_line "$raw")" || continue
            printf '%s\n' "$parsed" >> "$ALL"
          done < "$IMAGES_FILE"

          total="$(wc -l < "$ALL" | tr -d ' ')"
          [ "$total" -gt 0 ] || { echo "$IMAGES_FILE 为空" >&2; exit 1; }

          SHARD_FILE="$WORK/shard.txt"; : > "$SHARD_FILE"
          idx=0
          while IFS=$'\t' read -r p i; do
            if (( idx % SHARD_TOTAL == SHARD )); then
              printf '%s\t%s\n' "$p" "$i" >> "$SHARD_FILE"
            fi
            idx=$(( idx + 1 ))
          done < "$ALL"

          mine="$(wc -l < "$SHARD_FILE" | tr -d ' ')"
          log "分片 $SHARD/$SHARD_TOTAL 负责 $mine/$total 个镜像  模式=$MODE 架构=$PLATFORM"
          [ "$mine" -gt 0 ] || exit 0

          split -l "$BATCH_SIZE" -d "$SHARD_FILE" "$WORK/batch_"
          for batch in "$WORK"/batch_*; do
            [ -s "$batch" ] || continue
            log "--- 批次 $(basename "$batch") ---"
            if [ "$MODE" = "skopeo" ]; then
              xargs -a "$batch" -P "$PULL_CONCURRENCY" -I{} \
                bash -c 'IFS=$'"'"'\t'"'"' read -r p i <<< "$1"; skopeo_one "$p" "$i"' _ {} || true
            else
              xargs -a "$batch" -P "$PULL_CONCURRENCY" -I{} \
                bash -c 'IFS=$'"'"'\t'"'"' read -r p i <<< "$1"; pull_one "$p" "$i"' _ {} || true
              xargs -a "$batch" -P "$PUSH_CONCURRENCY" -I{} \
                bash -c 'IFS=$'"'"'\t'"'"' read -r p i <<< "$1"; push_one "$p" "$i"' _ {} || true
            fi
            reclaim
          done

          failed="$(wc -l < "$WORK/fail" | tr -d ' ')"
          log "分片 $SHARD 完成：$(( mine - failed ))/$mine 成功，$failed 失败"
          [ "$failed" -eq 0 ] || { cat "$WORK/fail" >&2; exit 1; }
          EOSCRIPT

          bash /tmp/sync.sh

      - name: Summary
        if: always()
        run: |
          df -h /
          echo "=== 目标仓库 ==="
          echo "$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE"
