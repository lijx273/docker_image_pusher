name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]

# 防止手动触发和 push 同时跑，避免同名镜像互相覆盖
concurrency:
  group: docker-sync
  cancel-in-progress: false

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  build:
    name: Pull & Push to Aliyun
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Before freeing up disk space
        run: |
          echo "Before freeing up disk space"
          echo "=============================================================================="
          df -hT
          echo "=============================================================================="

      # 增加可用磁盘空间（托管 runner 大约 14GB → 34GB 左右）
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 128
          remove-dotnet: 'true'
          remove-haskell: 'true'
          # 空间还是不够时，可以开启以下两项，清理出更多空间
          # remove-android: 'true'
          # remove-codeql: 'true'
          build-mount-path: '/var/lib/docker/'

      - name: Restart docker
        run: sudo service docker restart

      - name: Free up disk space complete
        run: |
          echo "Free up disk space complete"
          echo "=============================================================================="
          df -hT
          echo "=============================================================================="

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and push image Aliyun
        run: |
          set -euo pipefail

          # ---------- 0. 读取并预处理镜像清单 ----------
          # images.txt 每行格式：
          #   镜像名:标签                       例如 kasmweb/nginx:1.25.3
          #   --platform linux/amd64 镜像:标签   指定架构
          # 支持 # 注释与空行；自动去掉 Windows 的 \r 换行符
          if [[ ! -f images.txt ]]; then
            echo "ERROR: images.txt not found" >&2
            exit 1
          fi
          mapfile -t lines < <(grep -vE '^\s*#|^\s*$' images.txt | tr -d '\r')
          if (( ${#lines[@]} == 0 )); then
            echo "ERROR: images.txt is empty" >&2
            exit 1
          fi

          # ---------- 1. 先扫描一遍，找出"同名不同命名空间"的镜像 ----------
          # 例如 kasmweb/nginx 和 docker.io/nginx 都叫 nginx，推上去会冲突，
          # 需要对重名镜像加命名空间前缀，如 kasmweb_nginx:xxx
          declare -A duplicate_images
          declare -A temp_map
          for line in "${lines[@]}"; do
            image=$(awk '{print $NF}' <<< "$line")
            image="${image%%@*}"                      # 去掉 @sha256:... 摘要
            image_name_tag=$(awk -F'/' '{print $NF}' <<< "$image")
            name_space=$(awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}' <<< "$image")
            image_name=$(awk -F':' '{print $1}' <<< "$image_name_tag")

            if [[ -n "${temp_map[$image_name]:-}" ]]; then
              if [[ "${temp_map[$image_name]}" != "${name_space}_" ]]; then
                echo "duplicate image name detected: $image_name"
                duplicate_images[$image_name]="true"
              fi
            else
              temp_map[$image_name]="${name_space}_"
            fi
          done

          # ---------- 2. 逐条拉取 → 打标签 → 推送 → 清理 ----------
          for line in "${lines[@]}"; do
            echo "======================================================"
            echo ">>> 处理: $line"

            # 解析 --platform（兼容 --platform linux/amd64 和 --platform=linux/amd64）
            platform=$(awk -F'--platform[ =]' '{if (NF>1) print $2}' <<< "$line" | awk '{print $1}')
            if [[ -z "$platform" ]]; then
              platform_prefix=""
            else
              platform_prefix="${platform//\//_}_"
            fi

            image=$(awk '{print $NF}' <<< "$line")
            image="${image%%@*}"
            image_name_tag=$(awk -F'/' '{print $NF}' <<< "$image")
            image_name_tag="${image_name_tag%%@*}"
            name_space=$(awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}' <<< "$image")
            image_name=$(awk -F':' '{print $1}' <<< "$image_name_tag")

            # 重名镜像加命名空间前缀
            name_space_prefix=""
            if [[ -n "${duplicate_images[$image_name]:-}" && -n "$name_space" ]]; then
              name_space_prefix="${name_space}_"
            fi

            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/${platform_prefix}${name_space_prefix}${image_name_tag}"

            # 拉取（网络抖动自动重试 3 次）
            echo "docker pull $line"
            pull_ok=0
            for i in 1 2 3; do
              if docker pull $line; then
                pull_ok=1
                break
              fi
              echo "pull failed (attempt $i/3), retrying in 10s..."
              sleep 10
            done
            if (( pull_ok == 0 )); then
              echo "ERROR: docker pull failed for: $line" >&2
              exit 1
            fi

            echo "docker tag $image $new_image"
            docker tag "$image" "$new_image"
            echo "docker push $new_image"
            docker push "$new_image"

            echo "开始清理磁盘空间"
            echo "=============================================================================="
            df -hT
            echo "=============================================================================="
            docker rmi "$image" || true
            docker rmi "$new_image" || true
            docker image prune -f || true     # 清悬空镜像层
            docker builder prune -f || true   # 清构建缓存
            echo "磁盘空间清理完毕"
            echo "=============================================================================="
            df -hT
            echo "=============================================================================="
          done

          echo "======================================================"
          echo "ALL DONE: 全部镜像已同步到阿里云镜像仓库"
