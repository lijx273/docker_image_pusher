name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]

# 防止手动触发和 push 同时跑，避免同名镜像互相覆盖
concurrency:
  group: docker-sync
  cancel-in-progress: false

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"
  # 单个镜像失败时：true=立即中止（默认），false=跳过继续，最后统一报失败
  FAIL_FAST: "true"
  # 拉取前要求的最小可用磁盘空间（GB），有 milvus 这类大镜像建议 12 以上
  MIN_FREE_GB: "12"
  # 已存在于仓库的镜像直接跳过（断点续传）
  SKIP_EXISTING: "true"

jobs:
  build:
    name: Pull & Push to Aliyun
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Before freeing up disk space
        run: |
          echo "===== 初始磁盘状态 ====="
          df -hT

      # 最大化可用空间：卸载预装组件 + 把 /var/lib/docker 挂到大分区
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 128
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-android: 'true'         # 安卓 SDK 约 10GB+，建议开启
          remove-codeql: 'true'          # CodeQL 约 5GB，建议开启
          remove-docker-images: 'true'   # 清掉 runner 预装的镜像
          build-mount-path: '/var/lib/docker/'

      - name: Restart docker
        run: sudo service docker restart

      # ---- 根分区清理：runner 每次都是全新机器，预装组件/镜像全部可删 ----
      - name: 诊断根分区占用
        run: |
          echo "===== 根分区大目录 Top20（-x 不跨文件系统）====="
          sudo du -xhd1 / 2>/dev/null | sort -h | tail -20
          echo "===== 清理前根分区 ====="
          df -hT /

      - name: 清理根分区空间
        run: |
          # 工具链缓存（maximize-build-space 可能没删干净，这里强制再删一遍）
          sudo rm -rf /opt/hostedtoolcache 2>/dev/null || true
          sudo rm -rf /usr/local/lib/android 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet 2>/dev/null || true
          sudo rm -rf /opt/ghc /usr/local/share/ghc /usr/local/.ghcup 2>/dev/null || true
          sudo rm -rf /usr/local/lib/node_modules 2>/dev/null || true
          # 包缓存与临时文件
          sudo apt-get clean 2>/dev/null || true
          sudo rm -rf /var/lib/apt/lists 2>/dev/null || true
          sudo rm -rf /home/runner/.cache /root/.cache 2>/dev/null || true
          # 预装容器镜像数据（先停 docker，再删，containerd 会自动重建目录）
          sudo service docker stop 2>/dev/null || true
          sudo rm -rf /var/lib/containerd/io.containerd.content.v1.content \
                      /var/lib/containerd/io.containerd.snapshotter.v1.overlayfs 2>/dev/null || true
          echo "===== 清理后根分区 ====="
          df -hT /

      # 关键修复：docker 用 containerd 镜像存储时，镜像数据写在根分区的 /var/lib/containerd。
      # 把 /var/lib/containerd 重定向到 107G 的 /var/lib/docker 大分区，根分区不再参与镜像存储
      - name: Redirect containerd store to big partition
        run: |
          sudo mkdir -p /var/lib/docker/containerd-store
          sudo mount --bind /var/lib/docker/containerd-store /var/lib/containerd
          sudo service docker start
          echo "===== 重定向后 ====="
          df -hT / /var/lib/docker /var/lib/containerd

      - name: Purge leftover docker data
        run: |
          sudo docker system prune -af || true
          sudo docker builder prune -af || true

      - name: Free up disk space complete
        run: |
          echo "===== 最终磁盘状态 ====="
          df -hT

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and push image Aliyun
        run: |
          set -euo pipefail

          # ---------- 0. 读取并预处理镜像清单 ----------
          # images.txt 每行格式：
          #   镜像名:标签                        例如 kasmweb/nginx:1.25.3
          #   --platform linux/amd64 镜像:标签   指定架构
          #   镜像@sha256:...                   按摘要引用
          # 支持 # 注释与空行；自动去掉 Windows 的 \r 换行符
          if [[ ! -f images.txt ]]; then
            echo "ERROR: images.txt not found" >&2
            exit 1
          fi
          mapfile -t lines < <(grep -vE '^\s*#|^\s*$' images.txt | tr -d '\r')
          if (( ${#lines[@]} == 0 )); then
            echo "ERROR: images.txt is empty" >&2
            exit 1
          fi

          # ---------- 0.5 登录阿里云 ----------
          if ! echo "$ALIYUN_REGISTRY_PASSWORD" | docker login "$ALIYUN_REGISTRY" -u "$ALIYUN_REGISTRY_USER" --password-stdin; then
            echo "ERROR: docker login failed" >&2
            exit 1
          fi

          # ---------- 1. 检测同名不同命名空间的镜像（避免推送冲突） ----------
          declare -A duplicate_images
          declare -A temp_map
          for line in "${lines[@]}"; do
            image=$(awk '{print $NF}' <<< "$line")
            image="${image%%@*}"                      # 去掉 @sha256:... 摘要
            image_name_tag=$(awk -F'/' '{print $NF}' <<< "$image")
            name_space=$(awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}' <<< "$image")
            image_name=$(awk -F':' '{print $1}' <<< "$image_name_tag")

            if [[ -n "${temp_map[$image_name]:-}" ]]; then
              if [[ "${temp_map[$image_name]}" != "${name_space}_" ]]; then
                echo "duplicate image name detected: $image_name"
                duplicate_images[$image_name]="true"
              fi
            else
              temp_map[$image_name]="${name_space}_"
            fi
          done

          # ---------- 2. 磁盘空间检查 ----------
          check_disk() {
            local avail_docker avail_containerd avail
            avail_docker=$(df -B1 --output=avail /var/lib/docker 2>/dev/null | tail -1)
            avail_containerd=$(df -B1 --output=avail /var/lib/containerd 2>/dev/null | tail -1)
            [[ -z "$avail_docker" ]] && avail_docker=999999999999
            [[ -z "$avail_containerd" ]] && avail_containerd=999999999999
            avail=$(( avail_docker < avail_containerd ? avail_docker : avail_containerd ))
            if (( avail < MIN_FREE_BYTES )); then
              echo "ERROR: 可用磁盘不足 ${MIN_FREE_GB}GB（当前 $(numfmt --to=iec "$avail")），请清理或扩容后重试" >&2
              df -hT
              exit 1
            fi
          }
          MIN_FREE_BYTES=$(( MIN_FREE_GB * 1024 * 1024 * 1024 ))

          # ---------- 3. 逐条拉取 → 打标签 → 推送 → 清理 ----------
          success=0; skipped=0; failed=0
          failed_list=()
          for line in "${lines[@]}"; do
            echo "======================================================"
            echo ">>> 处理: $line"

            # 解析 --platform（兼容 --platform linux/amd64 和 --platform=linux/amd64）
            platform=$(awk -F'--platform[ =]' '{if (NF>1) print $2}' <<< "$line" | awk '{print $1}')
            if [[ -z "$platform" ]]; then
              platform_prefix=""
            else
              platform_prefix="${platform//\//_}_"
            fi

            image_src=$(awk '{print $NF}' <<< "$line")   # 完整引用（含摘要）
            image="${image_src%%@*}"                     # 仅名称:标签，用于命名
            image_name_tag=$(awk -F'/' '{print $NF}' <<< "$image")
            image_name_tag="${image_name_tag%%@*}"
            name_space=$(awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}' <<< "$image")
            image_name=$(awk -F':' '{print $1}' <<< "$image_name_tag")

            # 重名镜像加命名空间前缀
            name_space_prefix=""
            if [[ -n "${duplicate_images[$image_name]:-}" && -n "$name_space" ]]; then
              name_space_prefix="${name_space}_"
            fi

            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/${platform_prefix}${name_space_prefix}${image_name_tag}"

            # 已存在则跳过（断点续传，重新跑 workflow 不会重复推送）
            if [[ "$SKIP_EXISTING" == "true" ]] && docker manifest inspect "$new_image" >/dev/null 2>&1; then
              echo "SKIP: $new_image 已存在于仓库"
              skipped=$((skipped+1))
              continue
            fi

            # 磁盘不足提前报错，避免卡在解压层那一步
            check_disk

            # 拉取（网络抖动自动重试 3 次）
            echo "docker pull $line"
            pull_ok=0
            for i in 1 2 3; do
              if docker pull $line; then
                pull_ok=1
                break
              fi
              echo "pull failed (attempt $i/3), retrying in 10s..."
              sleep 10
              docker system prune -f >/dev/null 2>&1 || true   # 清掉拉取失败的残留
            done

            # 打标签 + 推送（仅当拉取成功；推送同样重试 3 次）
            push_ok=0
            if (( pull_ok == 1 )); then
              echo "docker tag $image_src $new_image"
              docker tag "$image_src" "$new_image"
              echo "docker push $new_image"
              for i in 1 2 3; do
                if docker push "$new_image"; then
                  push_ok=1
                  break
                fi
                echo "push failed (attempt $i/3), retrying in 10s..."
                sleep 10
              done
            fi

            if (( pull_ok == 0 || push_ok == 0 )); then
              failed=$((failed+1))
              failed_list+=("$line")
              echo "FAILED: $line" >&2
              docker rmi "$image_src" 2>/dev/null || true
              docker rmi "$new_image" 2>/dev/null || true
              docker system prune -f >/dev/null 2>&1 || true
              if [[ "$FAIL_FAST" == "true" ]]; then
                echo "ERROR: $line 处理失败，FAIL_FAST=true 已中止（可在 env 里改为 false 跳过继续）" >&2
                exit 1
              fi
              continue
            fi

            success=$((success+1))
            echo "开始清理磁盘空间"
            echo "=============================================================================="
            df -hT /var/lib/docker /var/lib/containerd
            echo "=============================================================================="
            docker rmi "$image_src" || true
            docker rmi "$new_image" || true
            docker image prune -f || true     # 清悬空镜像层
            docker builder prune -f || true   # 清构建缓存
            echo "磁盘空间清理完毕"
            echo "=============================================================================="
            df -hT /var/lib/docker /var/lib/containerd
            echo "=============================================================================="
          done

          # ---------- 4. 汇总 ----------
          echo "======================================================"
          echo "完成：成功 $success / 跳过 $skipped / 失败 $failed"
          if (( failed > 0 )); then
            echo "失败列表："
            printf '  %s\n' "${failed_list[@]}"
            echo "======================================================"
            exit 1
          fi
          echo "ALL DONE: 全部镜像已同步到阿里云镜像仓库"
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            {
              echo "## 镜像同步结果"
              echo "- ✅ 成功：$success"
              echo "- ⏭️ 跳过：$skipped"
              echo "- ❌ 失败：$failed"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
