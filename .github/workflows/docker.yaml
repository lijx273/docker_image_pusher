name: Docker Sync (skopeo)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Install skopeo
      run: |
        sudo apt-get update
        sudo apt-get install -y skopeo
        skopeo --version

    - name: Sync images to Aliyun
      run: |
        total=$(grep -v '^\s*#' images.txt | grep -v '^\s*$' | wc -l)
        count=0
        failed=0

        while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            echo "$line" | grep -q '^\s*#' && continue

            count=$((count + 1))
            echo ""
            echo "============================================================"
            echo "[$count/$total] $line"
            echo "============================================================"

            # 提取架构参数
            platform=$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
            image=$(echo "$line" | awk '{print $NF}')
            image="${image%%@*}"

            # 提取镜像名和命名空间（处理重名）
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

            # 架构前缀
            if [ -z "$platform" ]; then
                platform_prefix=""
                skopeo_arch=""
            else
                platform_prefix="${platform//\//_}_"
                skopeo_arch="--override-arch $(echo $platform | awk -F'/' '{print $2}') --override-os $(echo $platform | awk -F'/' '{print $1}')"
            fi

            # 命名空间前缀（重名时加）
            name_space_prefix=""
            if [[ -n "$name_space" ]]; then
                # 简单处理：所有镜像都加命名空间前缀，避免重名
                name_space_prefix="${name_space}_"
            fi

            image_name_tag="${image_name_tag%%@*}"
            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag"

            echo "Source: $image"
            echo "Dest:   $new_image"

            if skopeo copy \
              --dest-creds "$ALIYUN_REGISTRY_USER:$ALIYUN_REGISTRY_PASSWORD" \
              --all \
              $skopeo_arch \
              "docker://$image" \
              "docker://$new_image"; then
                echo "✅ OK: $new_image"
            else
                echo "❌ FAILED: $image"
                failed=$((failed + 1))
            fi

        done < images.txt

        echo ""
        echo "============================================================"
        echo "Done: $((total - failed))/$total success, $failed failed"
        echo "============================================================"

        if [ $failed -gt 0 ]; then
            exit 1
        fi
